name: Build FFI All Platforms

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: libeasytier_ffi.so
            cross: false
            cargo_extra: ""

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: libeasytier_ffi.so
            cross: true
            cargo_extra: '--config target.aarch64-unknown-linux-gnu.linker="aarch64-linux-gnu-gcc"'

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: easytier_ffi.dll
            cross: false
            cargo_extra: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: libeasytier_ffi.dylib
            cross: false
            cargo_extra: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git URL rewrite
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Read project Rust toolchain
        id: tc
        shell: bash
        run: |
          CHANNEL=stable
          if [ -f rust-toolchain.toml ]; then
            FOUND=$(grep -E '^\s*channel\s*=' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/' | head -1)
            if [ -n "$FOUND" ]; then CHANNEL="$FOUND"; fi
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust and target
        shell: bash
        run: |
          rustup toolchain install ${{ steps.tc.outputs.channel }}
          rustup target add ${{ matrix.target }} --toolchain ${{ steps.tc.outputs.channel }}

      # Linux 用 apt 安装
      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # macOS 用 brew 安装，替代失效的 arduino/setup-protoc
      - name: Install protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install protobuf
          protoc --version

      # Windows 用 choco 安装
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install protoc -y
          protoc --version

      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build easytier-ffi
        run: cargo build --release --package easytier-ffi --target ${{ matrix.target }} ${{ matrix.cargo_extra }}

      - uses: actions/upload-artifact@v4
        with:
          name: easytier-ffi-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
